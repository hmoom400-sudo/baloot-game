<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة البلوت الاحترافية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 900px;
            height: 600px;
            background: linear-gradient(135deg, #1b263b, #415a77);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }
        h1 {
            font-size: 24px;
            margin: 0;
            color: #e0e1dd;
        }
        .table-area {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .card-center {
            background: #ffffff;
            color: #000;
            padding: 20px 30px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .info-text {
            margin-top: 15px;
            font-size: 16px;
            color: #778da9;
        }
        .btn-action {
            background-color: #38b000;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-action:hover {
            background-color: #2b9348;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>لعبة البلوت 🃏</h1>
        
        <div class="table-area">
            <div class="card-center">♠ 10</div>
            <div class="info-text">مرحلة الشراء - المكشوف في المنتصف</div>
        </div>

        <button class="btn-action" onclick="alert('أهلاً بك على طاولة البلوت! اللعبة تعمل بكفاءة تامة.')">بدء التحدي</button>
    </div>

</body>
</html>
