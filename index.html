<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة البلوت الاحترافية</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .game-container {
            width: 100%;
            max-width: 950px;
            height: 620px;
            background: linear-gradient(135deg, #1b263b, #415a77);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            box-sizing: border-box;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            color: #e0e1dd;
        }
        .score-board {
            background: #0d1b2a;
            padding: 5px 15px;
            border-radius: 8px;
            font-size: 14px;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .table-center {
            flex-grow: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .card-deck {
            background: #ffffff;
            color: #000;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            margin-bottom: 10px;
        }
        .player-status {
            font-size: 14px;
            color: #778da9;
            background: rgba(0,0,0,0.3);
            padding: 5px 15px;
            border-radius: 20px;
        }
        .players-layout {
            display: flex;
            justify-content: space-between;
            width: 100%;
            align-items: center;
            margin-top: 10px;
        }
        .player-box {
            background: rgba(0,0,0,0.2);
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .my-hand {
            display: flex;
            gap: 5px;
            background: rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 10px;
        }
        .card {
            background: #fff;
            color: #d90429;
            width: 35px;
            height: 50px;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- الهيدر -->
        <div class="header">
            <div class="title">🃏 لعبة البلوت - طاولة الأربعة</div>
            <div class="score-board">الهدف: 152 | لهم: 0 - لنا: 0</div>
        </div>
        
        <!-- الطاولة واللاعبين -->
        <div class="table-center">
            <div class="player-box" style="margin-bottom: 15px;">فهد (شريكك) - في الانتظار</div>
            
            <div class="card-deck">♠ 10</div>
            <div class="player-status">مرحلة الشراء - الكارت المكشوف في المنتصف</div>

            <div class="players-layout">
                <div class="player-box">صالح (بوت)</div>
                <div class="my-hand">
                    <div class="card">10</div>
                    <div class="card">9</div>
                    <div class="card">K</div>
                    <div class="card">J</div>
                    <div class="card">8</div>
                </div>
                <div class="player-box">بدر (بوت)</div>
            </div>
        </div>

    </div>

</body>
</html>
