<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة البلوت - إعدادات اللعبة</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .game-container {
            background: linear-gradient(135deg, #1b263b, #415a77);
            width: 100%;
            max-width: 450px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            border: 2px solid #778da9;
        }
        .crown-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }
        h2 {
            margin-bottom: 5px;
            font-size: 26px;
            color: #e0e1dd;
        }
        p.subtitle {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 15px;
            color: #cbd5e1;
            margin-bottom: 10px;
            text-align: right;
        }
        .options-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-option {
            flex: 1;
            background-color: #1e293b;
            color: #94a3b8;
            border: 2px solid #334155;
            padding: 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .btn-option.active {
            background-color: #3b82f6;
            color: #ffffff;
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .start-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.4);
            transition: transform 0.2s;
        }
        .start-btn:hover {
            transform: scale(1.02);
        }
        .game-board {
            display: none;
            text-align: center;
        }
        .table-felt {
            background-color: #064e3b;
            border: 4px solid #065f46;
            border-radius: 15px;
            height: 300px;
            position: relative;
            margin-bottom: 20px;
        }
        .card-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            color: black;
            padding: 20px 15px;
            border-radius: 8px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div class="game-container" id="settingsScreen">
        <div class="crown-icon">👑</div>
        <h2>إعدادات لعبة البلوت</h2>
        <p class="subtitle">العب أوفلاين ضد البوتات الذكية!</p>

        <div class="section-title">مستوى البوتات (الذكاء الاصطناعي)</div>
        <div class="options-group">
            <button class="btn-option active" onclick="selectOption(this, 'diff')">سهل</button>
            <button class="btn-option" onclick="selectOption(this, 'diff')">متوسط</button>
            <button class="btn-option" onclick="selectOption(this, 'diff')">محترف</button>
        </div>

        <div class="section-title">هدف الفوز بالمباراة (نقاط)</div>
        <div class="options-group">
            <button class="btn-option active" onclick="selectOption(this, 'score')">152 نقطة (الرسمي)</button>
            <button class="btn-option" onclick="selectOption(this, 'score')">101 نقطة (سريع)</button>
        </div>

        <button class="start-btn" onclick="startGame()">▶ ابدأ اللعب الآن</button>
    </div>

    <!-- شاشة اللعب التفاعلية الداخلية -->
    <div class="game-container game-board" id="boardScreen">
        <h2>طاولة البلوت</h2>
        <p class="subtitle">مرحلة الشراء - المكشوف في المنتصف</p>
        <div class="table-felt">
            <div class="card-center">
                10 ♣<br><span style="font-size:11px; color:#555;">كرت المكشوف</span>
            </div>
        </div>
        <button class="start-btn" style="background:#ef4444;" onclick="resetGame()">العودة للإعدادات</button>
    </div>

    <script>
        function selectOption(button, groupClass) {
            // إزالة التفعيل من الأزرار في نفس المجموعة
            const parent = button.parentElement;
            parent.querySelectorAll('.btn-option').forEach(btn => {
                btn.classList.remove('active');
            });
            // تفعيل الزر المضغوط
            button.classList.add('active');
        }

        function startGame() {
            document.getElementById('settingsScreen').style.display = 'none';
            document.getElementById('boardScreen').style.display = 'block';
        }

        function resetGame() {
            document.getElementById('boardScreen').style.display = 'none';
            document.getElementById('settingsScreen').style.display = 'block';
        }
    </script>

</body>
</html>
